  <g stroke="#22251f" fill="none">
    <rect x="8" y="8" width="284" height="194" stroke-width="3"/>
    <path d="M8 100 H118 M118 8 V202" stroke-width="1.5"/>
    <path d="M118 74 H196 M196 8 V74" stroke-width="1.5"/>
    <path d="M118 160 H292" stroke-width="1.5"/>
  </g>
  <g fill="#22251f" font-family="ui-monospace, Menlo, monospace" font-size="8.5" letter-spacing="0.5">
    <text x="22" y="50">DORM 1</text>
    <text x="22" y="62" opacity="0.62">9 m²</text>
    <text x="22" y="142">DORM 2</text>
    <text x="22" y="154" opacity="0.62">7 m²</text>
    <text x="132" y="40">BANHO</text>
    <text x="210" y="40">COZINHA</text>
