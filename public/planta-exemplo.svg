<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 210" width="600" height="420" role="img" aria-label="Planta de exemplo: dois dormitórios, sala, cozinha, banheiro e varanda, 42 metros quadrados">
  <!-- Design-system fixture only. Geometry taken from docs/design/prototypes/proposta.html.
